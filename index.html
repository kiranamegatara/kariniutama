<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PT Karini Utama - PDF Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#123B8F',
                        navydark: '#0e2d6b',
                        yellow: '#FFD900',
                        yellowdark: '#e6c300'
                    }
                }
            }
        }
    </script>
    <!-- PDF-Lib for merging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- PDF.js for text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- JSZip for packaging output -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- FileSaver for triggering downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        #log-area::-webkit-scrollbar-thumb { background: #475569; }
        #log-area::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(18, 59, 143, 0.08);
        }

        .drag-over { 
            border-color: #123B8F !important; 
            background-color: rgba(18, 59, 143, 0.04) !important; 
            transform: scale(1.01);
        }
        
        .tab-active {
            background-color: #123B8F;
            color: #FFD900;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(18, 59, 143, 0.15);
        }
        .tab-inactive {
            color: #64748b;
        }
        .tab-inactive:hover {
            color: #123B8F;
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col selection:bg-yellow selection:text-navy">

    <header class="bg-white shadow-sm relative z-50">
        <div class="w-full h-1 bg-gradient-to-r from-navy via-yellow to-navy"></div>
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-center relative">
            <img src="Karini-Utama.png" alt="PT Karini Utama" class="h-12 md:h-16 object-contain drop-shadow-sm">
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto px-4 py-10 w-full flex flex-col gap-8">
        
        <div class="flex justify-center w-full overflow-x-auto pb-2">
            <div class="bg-white p-1.5 rounded-full shadow-sm border border-slate-200 flex flex-nowrap gap-1 relative min-w-max">
                <button class="tab-btn tab-active px-6 py-2.5 rounded-full text-sm transition-all duration-300" data-mode="binder">
                    Binder PDF
                </button>
                <button class="tab-btn tab-inactive px-6 py-2.5 rounded-full text-sm transition-all duration-300" data-mode="rename_bt">
                    Rename Bukti Transfer
                </button>
                <button class="tab-btn tab-inactive px-6 py-2.5 rounded-full text-sm transition-all duration-300" data-mode="rename_voucher">
                    Rename Voucher
                </button>
            </div>
        </div>

        <div class="glass-card rounded-3xl overflow-hidden flex flex-col lg:flex-row min-h-[500px]">
            
            <!-- Left Side: Dropzone & Info -->
            <div class="w-full lg:w-1/2 p-8 lg:p-10 flex flex-col">
                <div class="mb-6">
                    <h2 id="mode-title" class="text-2xl font-bold text-navy mb-2">Binder PDF</h2>
                    <p id="mode-desc" class="text-slate-500 text-sm leading-relaxed min-h-[40px]">
                        Menggabungkan PDF berdasarkan ID di awal nama file. Hanya menggabungkan jika pola akhiran persis ["1", "2", "3", "4", "5"] atau ["1", "2", "2.", "3", "4", "5"].
                    </p>
                </div>

                <div id="drop-zone" class="flex-grow border-2 border-dashed border-slate-300 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 cursor-pointer hover:border-navy group min-h-[250px] p-6 relative overflow-hidden bg-slate-50/50">
                    <div class="bg-white p-4 rounded-full mb-4 text-navy shadow-sm border border-slate-100 group-hover:scale-110 group-hover:shadow-md transition-all duration-300">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    </div>
                    <p class="text-slate-600 font-medium text-center z-10">Drag & Drop file PDF ke sini<br><span class="text-sm font-normal text-slate-400">atau klik untuk memilih file</span></p>
                    <input type="file" id="file-input" multiple accept=".pdf" class="hidden">
                    
                    <div id="file-count" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-navy text-yellow text-xs font-bold px-4 py-1.5 rounded-full shadow-md hidden opacity-0 transition-opacity duration-300">
                        0 File Terpilih
                    </div>
                </div>

                <button id="btn-process" class="w-full mt-6 bg-navy hover:bg-navydark text-white font-semibold py-4 rounded-xl shadow-lg shadow-navy/20 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 transform active:scale-[0.98]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                    Jalankan Proses
                </button>
            </div>

            <!-- Right Side: Terminal -->
            <div class="w-full lg:w-1/2 bg-[#0B1120] text-slate-300 flex flex-col relative">
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700/50 bg-[#0F172A]">
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                    </div>
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Terminal Log</span>
                    <button id="btn-clear-log" class="text-xs text-slate-400 hover:text-white transition-colors">Bersihkan</button>
                </div>
                
                <div id="log-area" class="flex-grow p-6 font-mono text-sm overflow-y-auto leading-relaxed h-[300px] lg:h-auto whitespace-pre-wrap pb-24">
                    <div class="text-slate-500">Menunggu input file...</div>
                </div>

                <!-- Floating Download Button -->
                <div class="absolute bottom-6 right-6 left-6 flex justify-end pointer-events-none">
                    <button id="btn-download" class="pointer-events-auto hidden bg-yellow hover:bg-yellowdark text-navy font-bold py-3 px-6 rounded-xl shadow-[0_8px_30px_rgba(255,217,0,0.25)] transition-all duration-300 flex items-center gap-2 transform hover:-translate-y-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        Unduh Hasil (ZIP)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileCountDisplay = document.getElementById('file-count');
        const btnProcess = document.getElementById('btn-process');
        const btnDownload = document.getElementById('btn-download');
        const logArea = document.getElementById('log-area');
        const btnClearLog = document.getElementById('btn-clear-log');
        const tabBtns = document.querySelectorAll('.tab-btn');
        
        const modeTitle = document.getElementById('mode-title');
        const modeDesc = document.getElementById('mode-desc');
        
        let currentMode = 'binder';
        let selectedFiles = [];
        let finalZip = null;

        const modeData = {
            'binder': { title: 'Binder PDF', desc: 'Menggabungkan PDF berdasarkan ID di awal nama file. Hanya menggabungkan jika pola akhiran persis ["1", "2", "3", "4", "5"] atau ["1", "2", "2.", "3", "4", "5"].' },
            'rename_bt': { title: 'Rename Bukti Transfer', desc: 'Membaca isi teks halaman 1. Mencari Nomor Dokumen. File akan di-rename menjadi [Nomor] 1.pdf.' },
            'rename_voucher': { title: 'Rename Voucher', desc: 'Membaca isi teks halaman 1. Mencari kode BPB. File akan di-rename menjadi [Kode]..pdf.' }
        };

        // Tab Switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => {
                    b.classList.remove('tab-active');
                    b.classList.add('tab-inactive');
                });
                btn.classList.remove('tab-inactive');
                btn.classList.add('tab-active');
                
                currentMode = btn.dataset.mode;
                modeTitle.textContent = modeData[currentMode].title;
                modeDesc.textContent = modeData[currentMode].desc;
                
                // Reset state on tab change to prevent accidental mix-ups
                selectedFiles = [];
                updateFileCount();
                logArea.innerHTML = `<div class="text-slate-500">Mode diubah ke ${modeData[currentMode].title}. Menunggu input...</div>`;
                btnDownload.classList.add('hidden');
            });
        });

        dropZone.addEventListener('click', () => fileInput.click());
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
        fileInput.addEventListener('change', function() { handleFiles(this.files); });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            if (newFiles.length === 0) {
                logMessage('❌ Tidak ada file PDF valid.', 'error');
                return;
            }
            
            selectedFiles = [...selectedFiles, ...newFiles];
            updateFileCount();
            btnDownload.classList.add('hidden');
            finalZip = null;
        }

        function updateFileCount() {
            if (selectedFiles.length > 0) {
                fileCountDisplay.textContent = `${selectedFiles.length} File PDF Siap`;
                fileCountDisplay.classList.remove('hidden');
                setTimeout(() => fileCountDisplay.classList.remove('opacity-0'), 50);
                logMessage(`ℹ️ ${selectedFiles.length} file diantrekan.`);
            } else {
                fileCountDisplay.classList.add('opacity-0');
                setTimeout(() => fileCountDisplay.classList.add('hidden'), 300);
            }
        }

        function logMessage(msg, type = 'info') {
            const div = document.createElement('div');
            div.textContent = msg;
            div.className = 'mb-1 ' + (
                type === 'error' ? 'text-red-400' : 
                type === 'warn' ? 'text-yellow-400' : 
                type === 'success' ? 'text-green-400 font-bold' : 
                'text-slate-300'
            );
            
            if (logArea.querySelector('.text-slate-500')) logArea.innerHTML = '';
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        btnClearLog.addEventListener('click', () => {
            logArea.innerHTML = '<div class="text-slate-500">Log dibersihkan...</div>';
        });

        // Helpers
        async function extractTextFromFirstPage(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                
                if (pdf.numPages === 0) return "";
                
                const page = await pdf.getPage(1);
                const textContent = await page.getTextContent();
                const text = textContent.items.map(item => item.str).join(' ');
                return text;
            } catch (error) {
                console.error("Error reading PDF:", error);
                return "";
            }
        }

        const arrayEquals = (a, b) => {
            return Array.isArray(a) &&
                Array.isArray(b) &&
                a.length === b.length &&
                a.every((val, index) => val === b[index]);
        };

        btnProcess.addEventListener('click', async () => {
            if (selectedFiles.length === 0) {
                logMessage('❌ Silakan masukkan file PDF terlebih dahulu.', 'error');
                return;
            }

            btnProcess.disabled = true;
            btnProcess.innerHTML = '<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...';
            btnDownload.classList.add('hidden');
            logArea.innerHTML = '';
            
            logMessage(`🚀 Memulai proses mode: ${modeData[currentMode].title}...`);
            finalZip = new JSZip();

            try {
                if (currentMode === 'binder') {
                    await processBinder();
                } else if (currentMode === 'rename_bt') {
                    await processRenameBT();
                } else if (currentMode === 'rename_voucher') {
                    await processRenameVoucher();
                }

                if (Object.keys(finalZip.files).length > 0) {
                    btnDownload.classList.remove('hidden');
                    logMessage('✅ Proses selesai. Silakan unduh file hasil (ZIP).', 'success');
                } else {
                    logMessage('⚠️ Proses selesai, tetapi tidak ada file yang berhasil diproses/dihasilkan.', 'warn');
                }
                
            } catch (error) {
                logMessage(`❌ Terjadi kesalahan fatal: ${error.message}`, 'error');
                console.error(error);
            } finally {
                btnProcess.disabled = false;
                btnProcess.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-8.707l-3-3a1 1 0 00-1.414 1.414L10.586 9H7a1 1 0 100 2h3.586l-1.293 1.293a1 1 0 101.414 1.414l3-3a1 1 0 000-1.414z" clip-rule="evenodd" />
                    </svg>
                    Jalankan Proses
                `;
            }
        });

        async function processBinder() {
            const grupDokumen = {};
            const pola_valid_1 = ["1", "2", "3", "4", "5"];
            const pola_valid_2 = ["1", "2", "2.", "3", "4", "5"];

            // 1. Group files
            for (const file of selectedFiles) {
                const nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
                const parts = nameWithoutExt.split(' ');
                
                if (parts.length > 1) {
                    const id = parts[0];
                    const akhiran = parts.slice(1).join(' ').trim();
                    
                    if (!grupDokumen[id]) grupDokumen[id] = [];
                    grupDokumen[id].push({ akhiran, file });
                }
            }

            const idList = Object.keys(grupDokumen);
            logMessage(`Ditemukan ${idList.length} Nomor File (ID) berbeda.`);
            let berhasil = 0, dilewati = 0;

            // 2. Process groups
            for (const id of idList) {
                const daftar_file = grupDokumen[id];
                
                // Sort array of objects based on string comparison of 'akhiran'
                daftar_file.sort((a, b) => a.akhiran.localeCompare(b.akhiran, undefined, {numeric: true}));
                
                const list_akhiran = daftar_file.map(item => item.akhiran);
                
                if (arrayEquals(list_akhiran, pola_valid_1) || arrayEquals(list_akhiran, pola_valid_2)) {
                    logMessage(`Menggabungkan ID ${id}...`);
                    
                    try {
                        const mergedPdf = await PDFLib.PDFDocument.create();
                        
                        for (const item of daftar_file) {
                            const arrayBuffer = await item.file.arrayBuffer();
                            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                            const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                            copiedPages.forEach((page) => mergedPdf.addPage(page));
                        }
                        
                        const pdfBytes = await mergedPdf.save();
                        
                        // Add to ZIP
                        finalZip.file(`${id}.pdf`, pdfBytes);
                        
                        berhasil++;
                        logMessage(`[SUKSES] ${id}.pdf -> Pola: ${JSON.stringify(list_akhiran)}`, 'success');
                    } catch (err) {
                        logMessage(`[ERROR] Gagal menggabungkan ${id}: ${err.message}`, 'error');
                        dilewati++;
                    }
                } else {
                    dilewati++;
                    logMessage(`[DILEWATI] ID ${id} tidak lengkap -> Isi: ${JSON.stringify(list_akhiran)}`, 'warn');
                }
            }
            
            logMessage(`-`.repeat(40));
            logMessage(`Total Berhasil : ${berhasil}`);
            logMessage(`Total Dilewati : ${dilewati}`);
        }

        async function processRenameBT() {
            let berhasil = 0, gagal = 0;

            for (const file of selectedFiles) {
                try {
                    const text = await extractTextFromFirstPage(file);
                    
                    let match = text.match(/Nomor\s*Dokumen\s*[:\s|]*(\d+)/i);
                    if (!match) {
                        match = text.match(/\b(21\d{8})\b/);
                    }

                    if (match) {
                        const nomor_dokumen = match[1] || match[0];
                        const newFilename = `${nomor_dokumen} 1.pdf`;
                        
                        // Get original file buffer
                        const arrayBuffer = await file.arrayBuffer();
                        
                        // Check if file already exists in zip to avoid overwriting blindly
                        // (Though JSZip handles it, it's good to log)
                        if(finalZip.file(newFilename)) {
                            logMessage(`⚠️ [DUPLIKAT] ${newFilename} sudah ada, menimpa versi sebelumnya.`, 'warn');
                        }
                        
                        finalZip.file(newFilename, arrayBuffer);
                        
                        berhasil++;
                        logMessage(`✅ [SUKSES] '${file.name}' -> '${newFilename}'`, 'success');
                    } else {
                        gagal++;
                        logMessage(`❌ [GAGAL] Nomor Dokumen tidak terbaca pada '${file.name}'`, 'error');
                    }
                } catch (e) {
                    gagal++;
                    logMessage(`⚠️ [ERROR] saat membaca '${file.name}': ${e.message}`, 'error');
                }
            }
            logMessage(`-`.repeat(40));
            logMessage(`Total Berhasil : ${berhasil}`);
            logMessage(`Total Gagal    : ${gagal}`);
        }

        async function processRenameVoucher() {
            let berhasil = 0, gagal = 0;

            for (const file of selectedFiles) {
                try {
                    const text = await extractTextFromFirstPage(file);
                    
                    const match = text.match(/BPB\s*0*(\d+)/i);

                    if (match) {
                        const angka = match[1];
                        const newFilename = `${angka}..pdf`;
                        
                        // Get original file buffer
                        const arrayBuffer = await file.arrayBuffer();
                        
                        finalZip.file(newFilename, arrayBuffer);
                        
                        berhasil++;
                        logMessage(`✅ [SUKSES] '${file.name}' -> '${newFilename}'`, 'success');
                    } else {
                        gagal++;
                        logMessage(`❌ [GAGAL] Kode BPB tidak terbaca pada '${file.name}'`, 'error');
                    }
                } catch (e) {
                    gagal++;
                    logMessage(`⚠️ [ERROR] saat membaca '${file.name}': ${e.message}`, 'error');
                }
            }
            logMessage(`-`.repeat(40));
            logMessage(`Total Berhasil : ${berhasil}`);
            logMessage(`Total Gagal    : ${gagal}`);
        }

        btnDownload.addEventListener('click', async () => {
            if (!finalZip) return;
            
            btnDownload.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3 text-navy" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> Mempersiapkan Unduhan...';
            
            try {
                const zipFileName = `Hasil_${currentMode}_${new Date().getTime()}.zip`;
                
                const content = await finalZip.generateAsync({ type: "blob" });
                saveAs(content, zipFileName);
                
                logMessage(`📥 Berhasil mengunduh: ${zipFileName}`, 'success');
            } catch (err) {
                logMessage(`❌ Error saat membuat ZIP: ${err.message}`, 'error');
            } finally {
                btnDownload.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    Unduh Hasil (ZIP)
                `;
            }
        });
    </script>
</body>
</html>
